[package]
name = "pando-cli"
version = "0.10.1"
edition = "2024"
# The oldest Rust that builds pando: 1.88, for `if … && let` chains and
# because ratatui, darling and instability need it themselves. The
# README and the website state it, `tests/distribution.rs` holds them to
# this line, and the CI job `msrv` builds with exactly this toolchain.
rust-version = "1.88"
description = "One repo. Every branch alive."
authors = ["Mert Karadayi <https://github.com/mertkaradayi>"]
license = "AGPL-3.0-only"
repository = "https://github.com/mertkaradayi/pando"
homepage = "https://mertkaradayi.github.io/pando/"
readme = "README.md"
keywords = ["git", "worktree", "dev-server", "tui", "cli"]
categories = ["command-line-utilities", "development-tools"]
# The README's pictures, the GitHub files and the website are for the
# repository and its pages, not for a build.
exclude = ["assets/", ".github/", ".claude-plugin/", "site/"]
# The files in tests/ are modules of one test binary: tests/integration.rs.
# The binary embeds agent/brief.md and agent/json.md (`pando init --agent`),
# so both must ship with the crate.
autotests = false

[lib]
name = "pando"
path = "src/lib.rs"

[[bin]]
name = "pando"
path = "src/main.rs"

[[test]]
name = "integration"
path = "tests/integration.rs"

[dependencies]
ansi-to-tui = "8"
anyhow = "1.0.102"
chrono = { version = "0.4.44", default-features = false, features = ["serde", "clock"] }
clap = { version = "4.6.1", features = ["derive"] }
clap_complete = "4.6.11"
crossterm = "0.29.0"
md5 = "0.8.0"
notify = "8"
notify-debouncer-full = "0.7"
ratatui = "0.30.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
toml = "1.1.6"
toml_edit = "0.25.15"
unicode-width = "0.2"

# What a Unix build talks to the OS with. Only src/platform names them, and
# its tests hold both that and this table.
[target.'cfg(unix)'.dependencies]
libc = "0.2.185"
nix = { version = "0.31.2", features = ["signal", "process"] }

[dev-dependencies]
serde_json = "1.0.149"
tempfile = "3.27.0"

# Dependencies are built optimised even in a dev build: the tests spend
# their CPU in ratatui's buffers and toml/serde parsing, not in pando's own
# code, and a dependency is compiled once, so pando's incremental builds
# stay as quick as they were.
[profile.dev.package."*"]
opt-level = 2

# The profile release binaries are built with (`dist`).
[profile.dist]
inherits = "release"
lto = "thin"

# No debug info in a dev build. On macOS, rustc leaves a debug build's
# object files in target/debug/deps for the debugger to read, and every
# incremental rebuild names them afresh, so each edit left about 1,500
# files behind for good: 246,000 files and 20 GB after the audit, with
# every compile, clippy and link slowed by scanning them. Without debug
# info rustc deletes them. Panics still name their file and line; for a
# debugger, build with CARGO_PROFILE_DEV_DEBUG=true.
[profile.dev]
debug = false

# How a release is built and published: `dist` (cargo-dist) reads this
# and generates .github/workflows/release.yml from it. Never edit that file
# by hand: change this, then run `dist generate`. A pushed `vX.Y.Z` tag
# builds the four targets (no Windows: a native build compiles, as CI
# checks, and refuses to run until src/platform has its backends), publishes a
# GitHub Release with checksums, attestations and a shell installer that
# installs into ~/.local/bin (it is for people without Rust), and pushes the
# `pando` formula to mertkaradayi/homebrew-tap. release-smoke.yml then
# installs that release the way the README says and runs it on a fixture.
[workspace.metadata.dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.33.0"
# CI backends to support
ci = "github"
# Target platforms to build apps for (Rust target-triple syntax)
targets = ["aarch64-apple-darwin", "aarch64-unknown-linux-musl", "x86_64-apple-darwin", "x86_64-unknown-linux-musl"]
# The installers to generate for each app
installers = ["shell", "homebrew"]
# A GitHub repo to push Homebrew formulas to
tap = "mertkaradayi/homebrew-tap"
# Customize the Homebrew formula name
formula = "pando"
# Publish jobs to run in CI. publish-homebrew.yml pushes the formula in
# place of dist's own homebrew job, without its minute of `brew update`.
publish-jobs = ["./publish-homebrew"]
# Post-announce jobs to run in CI
post-announce-jobs = ["./release-smoke"]
# Checksums to generate for each App
checksum = "sha256"
# Whether to enable GitHub Attestations
github-attestations = true
# Path that installers should place binaries in
install-path = ["$XDG_BIN_HOME/", "$XDG_DATA_HOME/../bin", "~/.local/bin"]
# Whether to install an updater program
install-updater = false
# Which actions to run on pull requests
pr-run-mode = "plan"

# The Intel macOS binary is cross-compiled on an Apple silicon runner:
# Apple's toolchain builds x86_64-apple-darwin natively there, in about
# the time the arm64 build takes, where the Intel runner took nine
# minutes and held back the formula. The smoke still runs it on Intel.
[workspace.metadata.dist.github-custom-runners.x86_64-apple-darwin]
runner = "macos-14"
host = "aarch64-apple-darwin"
