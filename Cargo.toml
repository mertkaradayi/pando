[package]
name = "pando-cli"
version = "0.4.0"
edition = "2024"
description = "One repo. Every branch alive."
authors = ["Mert Karadayi <https://github.com/mertkaradayi>"]
license = "AGPL-3.0-only"
repository = "https://github.com/mertkaradayi/pando"
homepage = "https://github.com/mertkaradayi/pando"
readme = "README.md"
keywords = ["git", "worktree", "dev-server", "tui", "cli"]
categories = ["command-line-utilities", "development-tools"]
# The README's pictures and the GitHub files are for the repository page,
# not for a build.
exclude = ["assets/", ".github/", ".claude-plugin/"]
# The files in tests/ are modules of one test binary: tests/integration.rs.
# The binary embeds agent/brief.md and agent/json.md (`pando init --agent`),
# so both must ship with the crate.
autotests = false

[lib]
name = "pando"
path = "src/lib.rs"

[[bin]]
name = "pando"
path = "src/main.rs"

[[test]]
name = "integration"
path = "tests/integration.rs"

[dependencies]
ansi-to-tui = "8"
anyhow = "1.0.102"
chrono = { version = "0.4.44", default-features = false, features = ["serde", "clock"] }
clap = { version = "4.6.1", features = ["derive"] }
clap_complete = "4.6.11"
crossterm = "0.29.0"
libc = "0.2.185"
md5 = "0.8.0"
nix = { version = "0.31.2", features = ["signal", "process"] }
notify = "8"
notify-debouncer-full = "0.5"
ratatui = "0.30.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
toml = "1.1.6"
toml_edit = "0.25.15"
unicode-width = "0.2"

[dev-dependencies]
serde_json = "1.0.149"
tempfile = "3.27.0"

# Dependencies are built optimised even in a dev build: the tests spend
# their CPU in ratatui's buffers and toml/serde parsing, not in pando's own
# code, and a dependency is compiled once, so pando's incremental builds
# stay as quick as they were.
[profile.dev.package."*"]
opt-level = 2

# No debug info in a dev build. On macOS, rustc leaves a debug build's
# object files in target/debug/deps for the debugger to read, and every
# incremental rebuild names them afresh, so each edit left about 1,500
# files behind for good: 246,000 files and 20 GB after the audit, with
# every compile, clippy and link slowed by scanning them. Without debug
# info rustc deletes them. Panics still name their file and line; for a
# debugger, build with CARGO_PROFILE_DEV_DEBUG=true.
[profile.dev]
debug = false
