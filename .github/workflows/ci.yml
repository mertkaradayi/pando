name: ci

# The paths below are ones no test reads: a change to them alone runs nothing.
# README.md, CONTRIBUTING.md, CLAUDE.md, agent/, assets/ and site/ are not
# among them, because tests hold those to the code. The two lists are the
# same; keep them so (tests/distribution.rs checks it).
on:
  push:
    branches: [main]
    paths-ignore:
      - "CHANGELOG.md"
      - "CODE_OF_CONDUCT.md"
      - "SECURITY.md"
      - "LICENSE"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/PULL_REQUEST_TEMPLATE.md"
      - ".github/dependabot.yml"
      - ".github/workflows/pages.yml"
  pull_request:
    paths-ignore:
      - "CHANGELOG.md"
      - "CODE_OF_CONDUCT.md"
      - "SECURITY.md"
      - "LICENSE"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/PULL_REQUEST_TEMPLATE.md"
      - ".github/dependabot.yml"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --check

  test:
    name: clippy and tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # While the repository is private every minute is paid and macOS's
        # count ten times, so a pull request runs Linux only and macOS runs on
        # main. Once it is public both run everywhere again.
        os: ${{ fromJSON(github.event_name == 'pull_request' && github.event.repository.private && '["ubuntu-latest"]' || '["macos-latest", "ubuntu-latest"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked --no-fail-fast
      # ext4 cannot clone, so on Linux the copy-on-write tests above take
      # git's own checkout and prove only that. Again, on a loop-mounted XFS
      # with reflinks, where FICLONE works and the copy-on-write checkout
      # really runs. macOS's runs are on APFS, which clones.
      - name: copy-on-write tests on a filesystem that clones
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xfsprogs
          truncate -s 2G "$RUNNER_TEMP/cow.img"
          mkfs.xfs -q -m reflink=1 "$RUNNER_TEMP/cow.img"
          sudo mkdir -p /mnt/cow
          sudo mount -o loop "$RUNNER_TEMP/cow.img" /mnt/cow
          sudo chown "$(id -u):$(id -g)" /mnt/cow
          export TMPDIR=/mnt/cow
          cargo test --locked --no-fail-fast --lib -- cow:: actions::tests::
          cargo test --locked --no-fail-fast --test integration invariant::

  msrv:
    # The oldest Rust pando says it builds with: Cargo.toml's rust-version,
    # read here rather than written twice. Only the library and the binary,
    # which is what `cargo install` builds; the tests' dependencies may need
    # newer.
    name: minimum Rust (rust-version)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - id: msrv
        run: echo "version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].rust_version')" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --locked --lib --bins
