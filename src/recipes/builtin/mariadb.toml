# MariaDB, which is also what `mysql` usually means on a developer's
# machine.
#
# Three things here are deliberate:
#
# - **`--socket {socket_dir}/mysql.sock`.** MariaDB's compiled-in socket
#   path is relative to nothing useful and its default lands beside the
#   data directory; `sun_path` is 104 bytes, and pando's data directory
#   path is most of that already. Clients here connect over TCP with
#   `--protocol=tcp`, which is not the default when a host is given.
# - **`--skip-grant-tables`, said out loud.** MariaDB enforces passwords
#   and a development URL carries one pando has no safe way to set — it
#   would be spliced into a `CREATE USER … IDENTIFIED BY` statement. So
#   the grant tables are skipped, which accepts any user and any
#   password on loopback. The origin tool did this silently; this recipe
#   says it in `notes`, `doctor` prints it, and anyone who wants real
#   accounts drops in their own `mariadb.toml`. Unlike MySQL's,
#   MariaDB's `--skip-grant-tables` does not imply `--skip-networking`,
#   which is why the binaries below are MariaDB's own by name: the same
#   flag on `mysqld` would leave nothing to connect to.
# - **`create` makes the database and nothing else.** With the grant
#   tables skipped there is no user to create, and `IF NOT EXISTS` is
#   what makes it safe to run on every start.
kind = "service"
name = "mariadb"
aliases = ["mysql"]
summary = "MariaDB: a server of this worktree's own, on a port pando allocated"
binaries = ["mariadbd", "mariadb", "mariadb-install-db"]
version_flag = "--version"
install = "brew install mariadb   (or your distribution's mariadb-server package)"
notes = "the grant tables are skipped, so any user and any password are accepted on 127.0.0.1 — a development server, and nothing off this machine can reach it"

[service]
port_env = "DATABASE_URL"
ready_timeout_s = 60

init = "mariadb-install-db --datadir={datadir} --auth-root-authentication-method=normal"

cmd = "exec mariadbd --datadir={datadir} --port={port} --bind-address=127.0.0.1 --socket={socket_dir}/mysql.sock --skip-grant-tables --skip-name-resolve --pid-file={datadir}/pando.pid"

ready = "mariadb --protocol=tcp -h 127.0.0.1 -P {port} -u root -e 'SELECT 1'"

create = "mariadb --protocol=tcp -h 127.0.0.1 -P {port} -u root -e 'CREATE DATABASE IF NOT EXISTS `{db_name}`'"

# Namespaced starts: a database of the worktree's own inside the main
# checkout's MariaDB — the developer's server, never one pando started.
#
# - **The password never reaches a command line.** The client reads it
#   from MYSQL_PWD, and `{user}` and `{host}` arrive shell-quoted.
# - **`create` has no `IF NOT EXISTS`.** A database already there is not
#   one pando made, and a start moves to another name rather than adopt
#   it; `rm` only ever drops what `create` made.
# - **A refused `create` is ERROR 1044**, and turns into the grant below:
#   the login may then make and drop `<main>__…` and nothing else.
[namespace]
kind = "database"
binaries = ["mariadb"]
install = "brew install mariadb, or your distribution's mariadb-client"
user = true
password_env = "MYSQL_PWD"
ping = "mariadb --protocol=tcp -h {host} -P {port} -u {user} -N -B -e 'SELECT 1'"
exists = "mariadb --protocol=tcp -h {host} -P {port} -u {user} -N -B -e \"SELECT SCHEMA_NAME FROM information_schema.SCHEMATA WHERE SCHEMA_NAME = '{namespace}'\""
list = "mariadb --protocol=tcp -h {host} -P {port} -u {user} -N -B -e \"SELECT SCHEMA_NAME FROM information_schema.SCHEMATA WHERE SCHEMA_NAME LIKE '{prefix_like}'\""
# Made in main's shape: its default character set and collation, read
# from information_schema and put in the CREATE through a prepared
# statement. A schema written for main runs into it as it runs into main;
# under a wider server default its keys can pass the 3072-byte limit
# (error 1071). Where main cannot be seen, the server's default.
create = """mariadb --protocol=tcp -h {host} -P {port} -u {user} -e "SET @ddl = COALESCE((SELECT CONCAT('CREATE DATABASE \\`{namespace}\\` CHARACTER SET ', DEFAULT_CHARACTER_SET_NAME, ' COLLATE ', DEFAULT_COLLATION_NAME) FROM information_schema.SCHEMATA WHERE SCHEMA_NAME = '{main}'), 'CREATE DATABASE \\`{namespace}\\`'); PREPARE pando_create FROM @ddl; EXECUTE pando_create; DEALLOCATE PREPARE pando_create""""
drop = "mariadb --protocol=tcp -h {host} -P {port} -u {user} -e 'DROP DATABASE IF EXISTS `{namespace}`'"
denied = ["ERROR 1044"]
account = "mariadb --protocol=tcp -h {host} -P {port} -u {user} -N -B -e 'SELECT CURRENT_USER()'"
grant = '''GRANT ALL ON `{prefix_like}`.* TO '{account_user}'@'{account_host}';'''
