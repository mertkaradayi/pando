# PostgreSQL.
#
# Two things here are not obvious and are both deliberate:
#
# - **`-k {socket_dir}`.** Postgres puts its Unix socket inside the data
#   directory unless told otherwise, and `sun_path` is 104 bytes on
#   macOS. A project name plus a branch name overflows that, so the
#   socket goes to a short, hashed path in the temporary directory and
#   every client here connects over TCP.
# - **`--auth trust` on `127.0.0.1`.** A development database on a random
#   high port bound to loopback gets trust authentication, because the
#   alternative is a password the developer never asked for and cannot
#   find. `doctor` says so in one line. Anyone who wants a password drops
#   their own `postgres.toml` in the recipes directory.
kind = "service"
name = "postgres"
aliases = ["postgresql", "pg"]
summary = "PostgreSQL: a cluster of this worktree's own, on a port pando allocated"
binaries = ["postgres", "initdb", "pg_isready", "psql", "createdb"]
version_flag = "--version"
install = "brew install postgresql@16   (or your distribution's postgresql-server package)"
notes = "trust authentication on 127.0.0.1 — any password in the URL is accepted, and nothing off this machine can reach it"

[service]
port_env = "DATABASE_URL"
ready_timeout_s = 60

# What initdb makes, and so what `{db_user}` and `{db_name}` mean when the
# app's own URL names neither.
db_user = "postgres"
db_name = "postgres"

init = "initdb --pgdata {datadir} --username postgres --auth trust --encoding UTF8 --no-locale"

# `exec`, so the pid pando records is the server's and not a shell that is
# waiting on it. `listen_addresses` is spelled out because the default,
# `localhost`, also binds `::1`.
cmd = "exec postgres -D {datadir} -p {port} -k {socket_dir} -c listen_addresses=127.0.0.1"

# `-U postgres -d postgres`, not because pg_isready authenticates — it
# does not, and returns 0 either way — but because the connection it opens
# is refused by name, and a bare probe leaves
# `FATAL: role "<your login>" does not exist` in the server's own log every
# time it is asked. A developer reading that log has enough to worry about.
ready = "pg_isready -h 127.0.0.1 -p {port} -U postgres -d postgres -q"

# Idempotent, and run after every readiness: the role and the database the
# app's own URL names have to exist, and which ones those are can change
# without the data directory changing at all. `{db_user}` and `{db_name}`
# come from the URL pando rewrote, and are `postgres` when there is none —
# in which case both lines are no-ops, since initdb made them.
create = '''
psql -h 127.0.0.1 -p {port} -U postgres -d postgres -v ON_ERROR_STOP=1 -tAc "SELECT 1 FROM pg_roles WHERE rolname = '{db_user}'" | grep -q 1 || psql -h 127.0.0.1 -p {port} -U postgres -d postgres -v ON_ERROR_STOP=1 -c "CREATE ROLE \"{db_user}\" LOGIN SUPERUSER"
psql -h 127.0.0.1 -p {port} -U postgres -d postgres -v ON_ERROR_STOP=1 -tAc "SELECT 1 FROM pg_database WHERE datname = '{db_name}'" | grep -q 1 || createdb -h 127.0.0.1 -p {port} -U postgres -O "{db_user}" "{db_name}"
'''

# Namespaced starts: a database of the worktree's own inside the main
# checkout's Postgres — the developer's server, never one pando started.
#
# - **Every command is `psql -X -w`.** `-X` so the developer's `~/.psqlrc`
#   cannot change what a command prints; `-w` so a server that wants a
#   password nobody gave fails at once instead of waiting on a prompt.
#   The password is read from PGPASSWORD, and `{user}` and `{host}`
#   arrive shell-quoted. Each connects to the `postgres` maintenance
#   database, which every cluster has.
# - **`create` has no way to say `IF NOT EXISTS`**, and does not need
#   one: a database already there makes it fail, and a start moves to
#   another name rather than adopt it.
# - **Names are quoted**, so `Shop__feat_x` is that and not `shop__feat_x`,
#   and **63 bytes at most**: Postgres cuts a longer name without an
#   error, and pando would record one the server does not have.
# - **Postgres cannot grant by prefix.** The fix for a refused `create` is
#   CREATEDB, which lets the login make any database; it can then drop
#   only the ones it owns, which are the ones it made. Behind pando's own
#   guard, that ownership is the server's wall. The image's own
#   POSTGRES_USER is a superuser, and needs nothing.
[namespace]
kind = "database"
binaries = ["psql"]
install = "brew install libpq and put $(brew --prefix libpq)/bin on PATH, or your distribution's postgresql-client"
user = true
password_env = "PGPASSWORD"
max_name = 63
ping = "psql -X -w -h {host} -p {port} -U {user} -d postgres -tAc 'SELECT 1'"
exists = "psql -X -w -h {host} -p {port} -U {user} -d postgres -tAc \"SELECT datname FROM pg_database WHERE datname = '{namespace}'\""
list = "psql -X -w -h {host} -p {port} -U {user} -d postgres -tAc \"SELECT datname FROM pg_database WHERE datname LIKE '{prefix_like}'\""
# Made in main's shape: its encoding, collation and character type, read
# from pg_database, from template0 — the one template a CREATEDB login may
# copy with another encoding. `\gexec` runs the statement the query
# builds, and quotes the name as it does. Where main cannot be seen, the
# server's default.
create = '''
psql -X -w -q -v ON_ERROR_STOP=1 -h {host} -p {port} -U {user} -d postgres <<'PANDO_SQL'
SELECT format('CREATE DATABASE %I TEMPLATE template0 ENCODING %L LC_COLLATE %L LC_CTYPE %L', '{namespace}', pg_encoding_to_char(encoding), datcollate, datctype) FROM pg_database WHERE datname = '{main}'
UNION ALL
SELECT format('CREATE DATABASE %I', '{namespace}') WHERE NOT EXISTS (SELECT 1 FROM pg_database WHERE datname = '{main}')
\gexec
PANDO_SQL
'''
# `WITH (FORCE)` (Postgres 13 and later) ends a session still open on the
# worktree's database — a shell left in it — which would otherwise keep
# `rm` from dropping it.
drop = "psql -X -w -v ON_ERROR_STOP=1 -h {host} -p {port} -U {user} -d postgres -c 'DROP DATABASE IF EXISTS \"{namespace}\" WITH (FORCE)'"
denied = ["permission denied to create database", "must be owner of database", "permission denied to drop database"]
grant = '''ALTER ROLE "{account_user}" CREATEDB;'''
grant_covers = "make databases, and drop only the ones it made"
