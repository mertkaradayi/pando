# Redis.
#
# No initialisation: redis makes its own data directory and writes
# `dump.rdb` into it, so the whole of "one instance's data" is the
# directory pando gives it. No Unix socket either — redis creates one
# only when asked — so nothing here needs `{socket_dir}`.
#
# Persistence is left at redis's own defaults rather than turned off: a
# worktree that is stopped and started again should find what it had,
# which is the same promise the Postgres recipe makes. SIGTERM makes
# redis save before it exits, and `stop` sends exactly that.
kind = "service"
name = "redis"
aliases = ["valkey", "cache"]
summary = "Redis: one instance of this worktree's own, on a port pando allocated"
binaries = ["redis-server", "redis-cli"]
version_flag = "--version"
install = "brew install redis   (or your distribution's redis-server package)"
notes = "no password, bound to 127.0.0.1 — nothing off this machine can reach it"

[service]
port_env = "REDIS_URL"
ready_timeout_s = 30

cmd = "exec redis-server --port {port} --bind 127.0.0.1 --dir {datadir} --daemonize no"
ready = "redis-cli -h 127.0.0.1 -p {port} ping"

# Namespaced starts: a numbered slot of the worktree's own inside the main
# checkout's Redis.
#
# Every command that names a slot goes through EVAL, because `redis-cli
# -n 16 FLUSHDB` on a server with 16 slots says "SELECT 16 failed" and
# then empties slot 0 — the main checkout's — exiting 0. Inside a script
# a SELECT that fails is an error and nothing after it runs, and `-e`
# makes that error an exit status. The password is read from
# REDISCLI_AUTH, never passed as `-a`. `size` passes `--raw`, so a count
# is the bare number a [namespace] `size` prints, whoever runs it.
[namespace]
kind = "slot"
binaries = ["redis-cli"]
install = "brew install redis, or your distribution's redis-tools"
password_env = "REDISCLI_AUTH"
slots = 16
ping = "redis-cli -e -h {host} -p {port} ping"
size = "redis-cli --raw -e -h {host} -p {port} EVAL \"redis.call('SELECT', ARGV[1]); return redis.call('DBSIZE')\" 0 {namespace}"
drop = "redis-cli -e -h {host} -p {port} EVAL \"redis.call('SELECT', ARGV[1]); return redis.call('FLUSHDB')\" 0 {namespace}"
denied = ["NOPERM"]
# A slot is known by host and port, and another Redis on the same port has
# a slot of the same number. pando marks each slot it gives out with a key
# of its own, and keeps which server process it was on: a slot is this
# worktree's while the mark says so, or while the server is the same
# process — an app that empties its slot takes the mark with its keys.
owner = "redis-cli --raw -e -h {host} -p {port} EVAL \"redis.call('SELECT', ARGV[1]); return redis.call('GET', KEYS[1])\" 1 pando:owner {namespace}"
claim = "redis-cli -e -h {host} -p {port} EVAL \"redis.call('SELECT', ARGV[1]); return redis.call('SET', KEYS[1], ARGV[2])\" 1 pando:owner {namespace} {owner}"
server_id = "redis-cli --raw -e -h {host} -p {port} INFO server | sed -n 's/^run_id:\\([0-9a-zA-Z]*\\).*/\\1/p'"

# Where an app names its slot: a URL's path, and `?db=`, which redis-py
# reads before the path; or `REDIS_DB` beside `REDIS_PORT`.
[namespace.address]
url_path = true
url_query = ["db"]
keys = ["_DB"]

# An app that names no slot — or a Redis Cluster, which has only slot 0 —
# can still keep a worktree's keys apart by a prefix it reads beside the
# address: Laravel's `REDIS_PREFIX`. Used only when no slot can be.
[prefix]
keys = ["_PREFIX", "_KEY_PREFIX"]
